<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="card">
    <h1>Crear cuenta</h1>
    <p class="subtitle">Es rápido y fácil</p>

    <div id="msg" class="msg"></div>

    <form id="registerForm">
      <div>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" required autocomplete="name" />
      </div>
      <div>
        <label for="email">Correo</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <div>
        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="new-password" />
      </div>
      <div>
        <label for="confirmPassword">Confirmar contraseña</label>
        <input type="password" id="confirmPassword" required autocomplete="new-password" />
      </div>
      <p style="font-size:12px;color:#6b7280;margin:0;">
        Mínimo 8 caracteres, una mayúscula y un número.
      </p>
      <button type="submit" class="btn-primary" id="registerBtn">Registrarme</button>
    </form>

    <div class="links">
      ¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
