<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verificar correo</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="card" style="text-align:center;">
    <div id="loadingState">
      <p class="center-text">Verificando tu correo...</p>
    </div>

    <div id="successState" style="display:none;">
      <div class="icon-box success">✓</div>
      <h1>¡Correo verificado!</h1>
      <p class="subtitle">Ya puedes iniciar sesión con tu cuenta.</p>
      <a href="index.html"><button class="btn-primary" style="width:100%">Ir a iniciar sesión</button></a>
    </div>

    <div id="errorState" style="display:none;">
      <div class="icon-box error">✕</div>
      <h1>No se pudo verificar</h1>
      <p class="subtitle" id="errorText">El enlace es inválido o ya expiró.</p>
      <a href="index.html"><button class="btn-secondary" style="width:100%">Volver al inicio</button></a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/verify-email.js"></script>
</body>
</html>
