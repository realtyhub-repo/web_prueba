<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="card">
    <h1>Bienvenido</h1>
    <p class="subtitle">Inicia sesión en tu cuenta</p>

    <div id="msg" class="msg"></div>

    <div id="resendBox" style="display:none; margin-bottom: 14px;">
      <button id="resendBtn" class="btn-secondary" style="width:100%">
        Reenviar correo de verificación
      </button>
    </div>

    <!-- Botón de Google -->
    <div id="googleBtnContainer" style="display:flex; justify-content:center; margin-bottom: 14px;"></div>

    <div class="divider">o continúa con tu correo</div>

    <form id="loginForm">
      <div>
        <label for="email">Correo</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <div>
        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">Ingresar</button>
    </form>

    <div class="links">
      <a href="forgot-password.html">¿Olvidaste tu contraseña?</a>
      <br /><br />
      ¿No tienes cuenta? <a href="register.html">Regístrate</a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
