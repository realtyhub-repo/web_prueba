<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer contraseña</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="card">
    <h1>Nueva contraseña</h1>
    <p class="subtitle">Ingresa tu nueva contraseña</p>

    <div id="msg" class="msg"></div>

    <div id="noTokenState" style="display:none;">
      <p class="center-text">
        Este enlace no es válido. Solicita uno nuevo desde
        <a href="forgot-password.html">recuperar contraseña</a>.
      </p>
    </div>

    <form id="resetForm">
      <div>
        <label for="password">Nueva contraseña</label>
        <input type="password" id="password" required autocomplete="new-password" />
      </div>
      <div>
        <label for="confirmPassword">Confirmar nueva contraseña</label>
        <input type="password" id="confirmPassword" required autocomplete="new-password" />
      </div>
      <p style="font-size:12px;color:#6b7280;margin:0;">
        Mínimo 8 caracteres, una mayúscula y un número.
      </p>
      <button type="submit" class="btn-primary" id="resetBtn">Cambiar contraseña</button>
    </form>

    <div class="links">
      <a href="index.html">Volver a iniciar sesión</a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
